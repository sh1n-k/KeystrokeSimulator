name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # 평소 1분 안에 끝난다. 테스트 교착 시 기본 6시간 대기를 막는다.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # v8부터 메이저 태그를 발행하지 않아 정확한 버전으로 고정한다.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv lock --check
      - run: uv sync --locked
      # Qt widget tests run offscreen (tests/qt_support.py) on both OSes.
      - run: uv run -m scripts.verify
